      - name: build the packages
        shell: bash
        # package.ts builds the crhs bundle, the crha node client and the crhu signing utility
        # (archives, deb and rpm) for every requested architecture.
        # deb/rpm packages are not published for now (doc/design/compatibility.md); uncomment to build them again.
