name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kodecable/crhs

jobs:
  packages:
    runs-on: ubuntu-latest
    environment: release
    # scripts/version.ts is the one place that turns the tag into a version; the other jobs read it here.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    # The build runs dependency install scripts and build tools, so it gets no OIDC token: only the sign
    # job, which runs nothing from the tree, can mint the identity crhs trusts. No cache is restored
    # either: a release builds from the lockfiles alone, not from what CI runs on main left behind.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: client/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: version
        id: version
        shell: bash
        # Fails unless the tag is v followed by a release version; the build scripts resolve the same.
        run: node scripts/version.ts --github-output
