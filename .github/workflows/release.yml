  # Signs what the packages job built. It checks out nothing and installs nothing from the tree, so the
  # OIDC token, whose certificate names this workflow at the tag, reaches only cosign and the attestation.
  sign:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: check SHA256SUMS against the assets
        shell: bash
        # SHA256SUMS also lists each crha binary under its path in the unpacked archive; unpack copies
        # elsewhere, so dist/release holds only the assets.
        run: |
          set -euo pipefail
          sums="$(mktemp -d)"
          # deb/rpm packages are not published for now (doc/design/compatibility.md); uncomment to build them again.
          # cp dist/release/SHA256SUMS dist/release/*.tar.gz dist/release/*.deb dist/release/*.rpm "$sums"/
          cp dist/release/SHA256SUMS dist/release/*.tar.gz "$sums"/
          (cd "$sums" && for archive in crha-*-linux-*.tar.gz; do tar -xzf "$archive" "${archive%.tar.gz}/crha"; done && sha256sum -c SHA256SUMS)
      # crhs verifies SHA256SUMS against this bundle with @sigstore/verify, which reads only the protobuf
      # bundle format (doc/design/distribution.md "Fetching the release"): pin a cosign that writes it.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: sign SHA256SUMS
        shell: bash
        run: cosign sign-blob --yes --new-bundle-format --bundle "$RUNNER_TEMP/SHA256SUMS.sigstore.json" dist/release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # deb/rpm packages are not published for now (doc/design/compatibility.md); uncomment to build them again.
          subject-path: |
            dist/release/*.tar.gz
            # dist/release/*.deb
            # dist/release/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/SHA256SUMS.sigstore.json
          if-no-files-found: error

  image:
    needs: packages
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      PRERELEASE: ${{ needs.packages.outputs.prerelease }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-context
          path: dist
      - name: restore the entrypoint mode
        shell: bash
        # Artifacts do not keep file permissions.
        run: chmod 0755 "dist/oci-context-${{ matrix.arch }}/entrypoint.sh"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/oci-context-${{ matrix.arch }}
          file: packaging/oci/Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CRH_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=ClusterRightHand server
            org.opencontainers.image.description=The ClusterRightHand server
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: write the digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "$digest" ]]; then
            echo "::error::the image build returned no digest"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: [packages, image]
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      PRERELEASE: ${{ needs.packages.outputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create the manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=("$RUNNER_TEMP"/digests/*)
          if (( ${#digests[@]} == 0 )); then
            echo "::error::no image digests were downloaded"
            exit 1
          fi
          refs=()
          for file in "${digests[@]}"; do
            refs+=("$IMAGE@sha256:$(basename "$file")")
          done
          tags=(-t "$IMAGE:$VERSION")
          if [[ "$PRERELEASE" != "true" ]]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: read the manifest digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$VERSION" | jq -r '.digest')"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::no manifest digest for $IMAGE:$VERSION"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: sign the image
        shell: bash
        run: cosign sign --yes "$IMAGE@${{ steps.manifest.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    needs: [packages, sign, manifest]
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      PRERELEASE: ${{ needs.packages.outputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist/release
      - name: create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=("$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes)
          args+=(--title "ClusterRightHand $VERSION")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
