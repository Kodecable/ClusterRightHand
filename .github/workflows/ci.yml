name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crh
          POSTGRES_PASSWORD: crh
          POSTGRES_DB: crh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRH_TEST_PG_URL: postgres://crh:crh@localhost:5432/crh_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @crh/web build
      - run: pnpm test:e2e
      - run: pnpm build:crhs --skip-web
      - run: pnpm --filter @crh/server test:bundle
      - name: install Chromium for the WebUI tests
        run: pnpm --filter @crh/web exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: pnpm --filter @crh/web test:ui:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: CRH_TEST_PODMAN=1 pnpm test:system
