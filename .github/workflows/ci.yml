name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crh
          POSTGRES_PASSWORD: crh
          POSTGRES_DB: crh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRH_TEST_PG_URL: postgres://crh:crh@localhost:5432/crh_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @crh/web build
      - run: pnpm test:e2e
      - run: pnpm build:crhs --skip-web
      - run: pnpm --filter @crh/server test:bundle
      - name: install Chromium for the WebUI tests
        run: pnpm --filter @crh/web exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: pnpm --filter @crh/web test:ui:mock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: CRH_TEST_PODMAN=1 pnpm test:system
