syntax = "proto3";

package crh.v1;

import "crh/v1/facts.proto";
import "crh/v1/task.proto";

option go_package = "github.com/Kodecable/ClusterRightHand/client/internal/proto/crhv1;crhv1";

// Envelope is the unit carried by one Noise transport message (at most 60 KiB encoded).
// New message types are added to the oneof; peers ignore unknown ones
// unless negotiated in Hello.capabilities.
message Envelope {
  oneof body {
    Hello hello = 1;
    Welcome welcome = 2;
    Ping ping = 3;
    Pong pong = 4;
    Facts facts = 5;
    NodeStatus node_status = 6;

    TaskStart task_start = 10;
    TaskInput task_input = 11;
    TaskAccepted task_accepted = 12;
    TaskRejected task_rejected = 13;
    TaskOutput task_output = 14;
    OutputAck output_ack = 15;
    TaskExit task_exit = 16;
    TaskCancel task_cancel = 17;
    TaskQuery task_query = 18;
    TaskStatus task_status = 19;
    TaskExitAck task_exit_ack = 20;

    // 30-39 reserved for privileged mode (TrustQuery, TrustSummary, Preflight, Revocations; M4).
  }
}

message Hello {
  string crha_version = 1;
  repeated string capabilities = 2;
  // Task kinds this client executes, e.g. "exec", "file.read".
  repeated string task_kinds = 3;
  // forward | native | ignore | reject
  string privileged_mode = 4;
  // Tasks the client still holds: running, or exited but not yet acknowledged.
  repeated TaskStatus tasks = 5;
}

message Welcome {
  repeated string capabilities = 1;
  // Acknowledged offsets for the tasks in Hello; the client resends from here.
  repeated OutputAck acks = 2;
}

message Ping {
  uint64 seq = 1;
}

message Pong {
  uint64 seq = 1;
}

// crhs -> crha on a restricted (pending) connection, and when the node's state changes.
message NodeStatus {
  string node_id = 1;
  string state = 2;
  string message = 3;
}

// The server has recorded the exit; the client may forget the task (and its in-memory output).
message TaskExitAck {
  string task_id = 1;
}
