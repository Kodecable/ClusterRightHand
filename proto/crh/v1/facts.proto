syntax = "proto3";

package crh.v1;

option go_package = "github.com/Kodecable/ClusterRightHand/client/internal/proto/crhv1;crhv1";

// System information reported on connect and whenever it changes.
message Facts {
  string hostname = 1;
  // From /etc/os-release.
  string os_id = 2;
  string os_version_id = 3;
  string os_pretty_name = 4;
  string kernel = 5;
  string arch = 6;
  string init_system = 7;
  repeated string package_managers = 8;
  // Which of sudo, doas, run0 are available.
  repeated string privilege_tools = 9;
  string notes_path = 10;
  // Node groups from the local configuration; crhs only caches them.
  repeated string groups = 11;
  // crha clock minus crhs clock, measured during the handshake.
  int64 clock_offset_ms = 12;
}
